[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repro-forge"
version = "0.1.0"
description = "Automated paper reading, methodology analysis, and reproduction for CS research"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "ReproForge Contributors" },
]
keywords = [
    "reproducibility",
    "paper-reading",
    "multi-agent",
    "llm",
    "deep-learning",
    "scientific-computing",
    "literature-review",
    "code-generation",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "tenacity>=8.5.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24.0", "pypdf2>=3.0.0"]
arxiv = ["arxiv>=2.1.0"]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.30.0"]
litellm = ["litellm>=1.40.0"]
memory = ["chromadb>=0.5.0"]
kg = ["neo4j>=5.20.0", "networkx>=3.3"]
api = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0", "sse-starlette>=2.0.0"]
docker = ["docker>=7.1.0"]
mlflow = ["mlflow>=2.14.0"]
telemetry = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]
eval = ["scipy>=1.13.0", "numpy>=1.26.0"]
all = [
    "repro-forge[pdf,arxiv,openai,anthropic,litellm,memory,kg,api,docker,mlflow,telemetry,eval]",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "testcontainers>=4.7.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.32.0",
    "types-PyYAML>=6.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-jupyter>=0.24.0",
    "coverage[toml]>=7.6.0",
]

[project.urls]
Homepage = "https://github.com/selfrestart/26Summer/tree/main/repro-forge"
Documentation = "https://github.com/selfrestart/26Summer/tree/main/repro-forge/docs"
Repository = "https://github.com/selfrestart/26Summer.git"
Issues = "https://github.com/selfrestart/26Summer/issues"
Discussions = "https://github.com/selfrestart/26Summer/discussions"

[project.scripts]
repro-forge = "repro_forge.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "notebooks",
    ".git",
    "__pycache__",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "B",
    "SIM",
    "PYI",
    "UP",
    "C4",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["repro_forge"]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "openai",
    "openai.*",
    "fitz",
    "arxiv",
    "chromadb",
    "neo4j",
    "mlflow",
    "docker",
    "opentelemetry.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=repro_forge",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-branch",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "integration: integration tests requiring services",
    "e2e: end-to-end tests",
    "llm: tests requiring LLM API calls (disabled by default)",
]

[tool.coverage.run]
source = ["repro_forge"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
fail_under = 65
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"']
"repro_forge/__init__.py" = ['__version__ = "{version}"']
"CITATION.cff" = ['version: {version}']

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "testcontainers>=4.7.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.32.0",
    "types-PyYAML>=6.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-jupyter>=0.24.0",
    "coverage[toml]>=7.6.0",
]
