# Optional service templates for planned phases. Neo4j and Chroma belong to P5;
# Jaeger belongs to P8. P0/P1 do not depend on these services, and this file is
# not evidence that their application adapters are implemented. Start it only
# with `docker compose -f compose.future.yml up`.
# Image references are explicit so a local run cannot silently select `latest`.
# P5/P8 readiness reviews must record compatible tags and digests; P7 production
# gates require digest pinning, SBOMs, and image-policy checks.
services:
  neo4j:
    image: "${NEO4J_IMAGE:?Set NEO4J_IMAGE to a reviewed tag or digest}"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u "${NEO4J_USER:-neo4j}"
          -p "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}" "RETURN 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chroma:
    image: "${CHROMA_IMAGE:?Set CHROMA_IMAGE to a reviewed tag or digest}"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  jaeger:
    image: "${JAEGER_IMAGE:?Set JAEGER_IMAGE to a reviewed tag or digest}"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  neo4j-data:
  neo4j-logs:
  chroma-data:
