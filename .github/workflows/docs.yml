name: ReproForge Documentation

on:
  push:
    branches: [main]
    paths:
      - "repro-forge/docs/**"
      - "repro-forge/repro_forge/**"
      - "repro-forge/pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repro-forge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --locked --group dev --python 3.13
      - name: Build documentation
        run: uv run mkdocs build --clean --strict -f docs/mkdocs.yml
