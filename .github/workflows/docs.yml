name: ReproForge Documentation

on:
  push:
    branches: [main]
    paths:
      - "repro-forge/docs/**"
      - "repro-forge/repro_forge/**"
      - "repro-forge/pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repro-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Build documentation
        run: mkdocs build --clean --strict -f docs/mkdocs.yml
