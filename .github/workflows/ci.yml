name: ReproForge CI

on:
  push:
    branches: [main, develop]
    paths:
      - "repro-forge/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "repro-forge/**"
      - ".github/workflows/ci.yml"

jobs:
  quality:
    name: Quality and package build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repro-forge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --group dev --python 3.13
      - name: Check formatting
        run: uv run ruff format --check repro_forge tests
      - name: Lint
        run: uv run ruff check repro_forge tests
      - name: Type check
        run: uv run mypy repro_forge
      - name: Build package
        run: uv build

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: repro-forge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v --no-header

  p3-security:
    name: P3 security regressions
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: repro-forge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --group dev --python 3.13
      - name: Run P3 contract and sandbox regression tests
        run: >-
          uv run pytest -q --no-cov
          tests/unit/test_p3_schemas.py
          tests/unit/test_p3_validation.py
          tests/unit/test_p3_code_forger.py
          tests/unit/test_p3_backends.py
          tests/unit/test_p3_pipeline.py

  p3-docker-smoke:
    name: P3 real Docker security smoke
    if: ${{ vars.REPROFORGE_P3_PYTHON_CPU_IMAGE != '' }}
    runs-on: ubuntu-latest
    needs: p3-security
    env:
      REPROFORGE_P3_PYTHON_CPU_IMAGE: ${{ vars.REPROFORGE_P3_PYTHON_CPU_IMAGE }}
    defaults:
      run:
        working-directory: repro-forge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Docker-enabled environment
        run: uv sync --locked --group dev --extra docker --python 3.13
      - name: Pull reviewed exact image digest
        run: docker pull "$REPROFORGE_P3_PYTHON_CPU_IMAGE"
      - name: Run the offline fixture smoke
        run: uv run pytest -q --no-cov -m docker tests/integration/test_p3_docker_smoke.py

  docker:
    name: Build P0 package image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t repro-forge:p0 repro-forge
      - name: Verify CLI entry point
        run: docker run --rm repro-forge:p0
