name: ReproForge Release Artifact

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repro-forge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build package
        run: uv build
      - name: Verify wheel installation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/repro-forge-wheel"
          "$RUNNER_TEMP/repro-forge-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/repro-forge-wheel/bin/repro-forge"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: repro-forge-dist
          path: repro-forge/dist/*
